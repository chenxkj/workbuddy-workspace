# 老陈抖音 · 标准化内容生产工作流
# Douyin Content Production Workflow for Lao Chen
#
# 使用方法：
#   clawflows run 老陈抖音内容生产 --topic "工程师越级告状"
#
# 流程：
#   Step 1: 抖音策略师 → 选题评估+风险判断
#   Step 2: 内容创作专家 → 输出12项交付物
#   Step 3: 去AI味（humanizer-zh） → 消除AI写作痕迹
#   Step 4: 查违禁词（douyin-sensitive-check） → 合规检测
#   Step 5: 数据分析报告师（可选） → 发布后数据复盘
#
# 账号背景（必须始终携带）：
#   人设：42岁，19年嵌入式研发总监，管过33人团队，三明学院毕业
#   在职转型AI自媒体，可靠权威不浮夸，去AI味口语化表达
#   核心内容：AI工具实测（35%）+ 中年转型（35%）+ 职场干货（25%）+ 研发垂类（5%）
#   变现：私域引流→品牌合作→付费资料包→电商带货
#   预算：冷启动期月≤300元，单条≤100元

name: 老陈抖音内容生产工作流
version: "3.0"
description: 老陈抖音账号标准化内容生产工作流：选题评估→方案输出→去AI味→查违禁词→数据复盘全流程
author: 老陈抖音运营团队
tags:
  - 抖音
  - 内容生产
  - 职场
  - AI

inputs:
  topic:
    type: string
    required: true
    description: 用户提供的话题/素材/选题方向
    example: 工程师越级找我告状，说经理是个傻逼

  source_type:
    type: string
    required: false
    description: 素材来源类型
    options:
      - 真实事件
      - 职场观察
      - AI实测
      - 转型日志
      - 粉丝提问
      - 热榜蹭流量
    default: 真实事件

  priority:
    type: string
    required: false
    description: 优先级
    options:
      - 紧急
      - 本周
      - 本月
    default: 本周

steps:

  # ============================================================
  # STEP 1：抖音策略师
  # 评估选题价值、风险、内容方向，制作决策
  # ============================================================
  - name: 选题评估
    agent: 抖音策略师
    description: 评估选题价值、风险、方向，给出制作决策

    context:
      account_stage: 冷启动期（0-90天）
      monthly_budget: 300元
      single_video_budget: 100元
      douyin_strategy: |
        核心原则：先让视频用自然流量证明自己，再决定追投
        追投触发条件：播放 > 3000 且完播率 > 40%
        不追投条件：播放 < 1000 或完播率 < 30%

    inputs:
      topic: "${inputs.topic}"
      source_type: "${inputs.source_type}"
      priority: "${inputs.priority}"

    tasks:
      - 判断选题是否适合老陈人设（可靠权威不浮夸）
      - 评估情绪共鸣强度（解气感/反差感/共鸣感/紧迫感）
      - 识别风险点（法律/隐私/人设/算法风险）
      - 给出选题定级（A/B+/B/C）
      - 确定本期内容类型（AI实测/职场干货/转型日志/研发垂类）
      - 建议是否做系列化
      - 给出内容比例调整建议（如需要）

    outputs:
      evaluation: "选题价值评分（1-5星）+ 选题定级（A/B+/B/C）+ 核心判断一句话"
      risk_warning: "风险提示清单（若有），含应对方式"
      content_type: "内容类型推荐"
      series_suggestion: "是否系列化 + 系列方向"
      priority: "制作优先级"

  # ============================================================
  # STEP 2：内容创作专家
  # 基于策略师评估，输出完整12项交付物
  # ============================================================
  - name: 内容创作
    agent: 内容创作专家
    depends_on: 选题评估
    description: 基于策略师评估结果，输出完整视频内容方案（12项交付物）

    context:
      script_principles: |
        口语化核心原则（必须遵守）：
        - 每句话≤15字
        - 删除连接词（并且/然而/因此 → 直接说）
        - 首先/其次/最后 → 第一/第二/然后
        - 删除管理学术语（系统性/本质上/结构性/赋能/维度）
        - 删除AI味表达（让我们/接下来/值得注意的是）
        - 结尾不硬升华（不写"理解这一点，比骂谁都管用"）
        - 说"给一个人听"，不对着镜头演讲
        - 停顿标注：每段结束时加"（停顿）"
        - BGM情绪：沉稳有力，不煽情

      title_principles: |
        标题5原则：
        - 含具体数字（3个/5个/10个）
        - 含身份背书词（19年/研发总监/33人团队）
        - 含情绪冲突词（傻逼/说谎/坑/真相）
        - 30字以内
        - A/B测试：准备5个不同风格版本

      tag_principles: |
        标签策略（4类，各选代表）：
        - 精准赛道（#职场管理 #中层管理 #职场干货）
        - 人设标签（#研发老兵 #老陈说AI）
        - 蹭热度（#打工人 #职场那些事）
        - SEO关键词（在标题/描述/标签中重复核心词）

      publish_time: |
        最佳发布时间（周二/四/六）：
        - 工作日：12:00-13:00 或 19:00-21:00
        - 周末：10:00-12:00 或 15:00-17:00

    inputs:
      topic: "${inputs.topic}"
      evaluation: "${steps.选题评估.outputs.evaluation}"
      risk_warning: "${steps.选题评估.outputs.risk_warning}"
      content_type: "${steps.选题评估.outputs.content_type}"

    tasks:
      - 交付物1：问题诊断报告（选题价值+风险提示+优化方向）
      - 交付物2：完整逐字稿（口语化版，去AI味，含停顿标注）
      - 交付物3：分镜脚本（镜号/时长/画面/台词/字幕/BGM/拍摄建议）
      - 交付物4：流量预计（基础预测表+分级预期+爆款8项检查清单）
      - 交付物5：投放预算决策（是否投放+金额+ROI预估）
      - 交付物6：标题方案×5（不同风格，含推荐指数）
      - 交付物7：话题标签策略（精准赛道+人设+热度+SEO关键词）
      - 交付物8：描述文案发布版（可直接复制）
      - 交付物9：评论区运营策略（神评论预设+互动节奏时间表）
      - 交付物10：内容质量评分卡（100分制，发布前自检）
      - 交付物11：优化前后对比（本次改进点记录）
      - 交付物12：复盘模板（下期改进方向）

    outputs:
      deliverable_01: 问题诊断报告
      deliverable_02: 完整逐字稿（口语化版）
      deliverable_03: 分镜脚本
      deliverable_04: 流量预计
      deliverable_05: 投放预算决策
      deliverable_06: 标题方案×5
      deliverable_07: 话题标签策略
      deliverable_08: 描述文案发布版
      deliverable_09: 评论区运营策略
      deliverable_10: 内容质量评分卡
      deliverable_11: 优化前后对比
      deliverable_12: 复盘模板

    # ============================================================
  # STEP 3：去AI味（humanizer-zh skill）
  # 对逐字稿/描述文案/标题执行AI痕迹去除
  # ============================================================
  - name: 去AI味
    agent: 内容创作专家
    depends_on: 内容创作
    description: 对逐字稿/标题/描述文案执行AI味去除，让人听起来像真人说话

    context:
      ai_traces_to_fix: |
        必须修复的AI痕迹模式：
        - 夸大的象征意义
        - 宣传性语言（"值得注意的是"/"从某种程度上"）
        - 以-ing结尾的肤浅分析
        - 模糊的归因
        - 破折号过度使用
        - 三段式法则（"首先/其次/最后"）
        - AI特征词汇（"让我们"/"接下来"/"因此"）
        - 否定式排比
        - 过多连接性短语
        - 结尾硬升华

    inputs:
      raw_script: "${steps.内容创作.outputs.deliverable_02}"
      raw_titles: "${steps.内容创作.outputs.deliverable_06}"
      raw_description: "${steps.内容创作.outputs.deliverable_08}"

    tasks:
      - 逐字稿去AI味：处理后读一遍，感觉像朋友在跟你聊天
      - 标题去AI味：确保标题口语化，无AI感
      - 描述文案去AI味：自然流畅，无营销腔
      - 输出去AI味修复清单（说明修了哪些痕迹）

    outputs:
      deai_script: 去AI味后的逐字稿
      deai_titles: 去AI味后的标题×5
      deai_description: 去AI味后的描述文案
      traces_removed: 修复的AI痕迹清单

  # ============================================================
  # STEP 4：查违禁词（douyin-sensitive-check skill）
  # 对去AI味后的文本执行违禁词检测，确保合规
  # ============================================================
  - name: 查违禁词
    agent: 内容创作专家
    depends_on: 去AI味
    description: 对去AI味后的文本执行抖音违禁词检测，确保合规发布

    inputs:
      script_to_check: "${steps.去AI味.outputs.deai_script}"
      titles_to_check: "${steps.去AI味.outputs.deai_titles}"
      description_to_check: "${steps.去AI味.outputs.deai_description}"

    tasks:
      - 逐字稿违禁词检测：扫描禁用词/绝对词/引战词
      - 标题违禁词检测：确保标题合规
      - 描述文案违禁词检测：检查营销引流话术
      - 违禁词处理：有则替换/删除 → 重新检测 → 确认通过

    outputs:
      violation_report: 违禁词检测报告（三份：逐字稿/标题/描述）
      violations_found: 发现的违禁词列表（若无则为空）
      final_script: 合规通过版逐字稿（可直接发布）
      final_titles: 合规通过版标题
      final_description: 合规通过版描述文案
      publish_ready: 是否通过（true/false）

  # ============================================================
  # STEP 5：数据分析报告师（可选，手动触发）
  # 视频发布后，基于实际数据复盘，给出策略调整
  # ============================================================
  - name: 数据复盘
    agent: 数据分析报告师
    trigger: manual
    description: 发布后数据复盘，输出策略调整建议

    context:
      account_stage: 冷启动期（0-90天）
      monthly_budget: 300元

    inputs:
      video_metrics: 播放量/完播率/互动率/涨粉数/收藏数/转发数
      planned_metrics: "${steps.内容创作.outputs.deliverable_04}"
      actual_metrics: 由用户提供实际数据
      deai_results: "${steps.去AI味.outputs.traces_removed}"
      violation_results: "${steps.查违禁词.outputs.violations_found}"

    tasks:
      - 对比流量预计与实际数据
      - 分析各项指标达标情况
      - 评估投放ROI（若有投放）
      - 给出下期内容方向调整建议
      - 更新内容矩阵建议

    outputs:
      data_report: 数据复盘报告
      strategy_adjustment: 策略调整建议
      budget_roi_analysis: 本期ROI分析
      next_episode_suggestion: 下期选题建议
