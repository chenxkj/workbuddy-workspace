# 老陈抖音 · 标准化内容生产工作流
# Douyin Content Production Workflow for Lao Chen
#
# 使用方法：
#   1. 用户输入选题/话题素材
#   2. 自动触发 Step 1（策略师评估）→ Step 2（内容创作）
#   3. 输出完整 12 项交付物
#   4. 视频发布后，进入 Step 3（数据分析）进行复盘
#
# 角色配置：
#   抖音策略师：选题判断、方向决策、DOU+决策、风险把控
#   内容创作专家：脚本、分镜、标题、标签、评论策略等 12 项交付
#   数据分析报告师（可选）：发布后数据复盘、策略调整建议

name = "老陈抖音内容生产工作流"
version = "3.0"
description = "老陈抖音账号标准化内容生产工作流，含选题评估→方案输出→去AI味→查违禁词→数据复盘全流程"
author = "老陈抖音运营团队"
tags = ["抖音", "内容生产", "职场", "AI"]

# ============================================================
# 输入参数
# ============================================================
[[params]]
name = "topic"
type = "string"
required = true
description = "用户提供的话题/素材/选题方向"
example = "工程师越级找我告状，说经理是个傻逼"

[[params]]
name = "source_type"
type = "string"
required = false
description = "素材来源类型"
options = ["真实事件", "职场观察", "AI实测", "转型日志", "粉丝提问", "热榜蹭流量"]
default = "真实事件"

[[params]]
name = "priority"
type = "string"
required = false
description = "优先级"
options = ["紧急", "本周", "本月"]
default = "本周"

# ============================================================
# STEP 1：抖音策略师（选题评估）
# ============================================================
[[steps]]
name = "选题评估"
agent = "抖音策略师"
capability = "content-strategy"
description = "评估选题价值、风险、方向，给出制作决策"

[steps.inputs]
topic = "${topic}"
source_type = "${source_type}"

[steps.outputs]]
evaluation = "选题价值评分（1-5星）+ 选题定级（A/B+/B/C）+ 核心判断"
risk_warning = "风险提示清单（若有）"
content_type = "内容类型推荐（AI实测/职场干货/转型日志/研发垂类/生活方式）"
content_ratio_recommend = "推荐内容比例调整建议"
series_suggestion = "是否做系列化+系列方向建议"
priority = "制作优先级"

# ============================================================
# STEP 2：内容创作专家（12项交付物）
# ============================================================
[[steps]]
name = "内容创作"
agent = "内容创作专家"
capability = "content-creation"
depends_on = ["选题评估"]
description = "基于策略师评估结果，输出完整视频内容方案（12项交付物）"

[steps.inputs]
topic = "${topic}"
source_type = "${source_type}"
evaluation = "${steps.选题评估.outputs.evaluation}"
content_type = "${steps.选题评估.outputs.content_type}"
risk_warning = "${steps.选题评估.outputs.risk_warning}"
lao_chen_profile = "42岁，19年嵌入式研发总监，管过33人团队，三明学院毕业，在职转型AI自媒体，可靠权威不浮夸，人设口语化去AI味"

[steps.outputs]]
deliverable_01 = "问题诊断报告（含选题价值判断+风险提示+优化方向）"
deliverable_02 = "完整逐字稿（口语化≤15字/句，无AI味，无管理学术语，无硬升华）"
deliverable_03 = "分镜脚本（镜号/时长/画面/台词/字幕/BGM/拍摄建议）"
deliverable_04 = "流量预计（含基础预测表+分级预期+爆款触发条件清单8项）"
deliverable_05 = "投放预算决策（是否投放+金额+ROI预估，本期ROI公式）"
deliverable_06 = "标题方案 ×5（不同风格，含推荐指数，供A/B测试）"
deliverable_07 = "话题标签策略（精准赛道+人设+热度+SEO关键词）"
deliverable_08 = "描述文案（发布版简介，可直接复制）"
deliverable_09 = "评论区运营策略（神评论预设+互动节奏时间表）"
deliverable_10 = "内容质量评分卡（100分制，发布前自检表）"
deliverable_11 = "优化前后对比（本次改进点记录）"
deliverable_12 = "复盘模板（下期改进方向框架）"

# ============================================================
# STEP 3：去AI味（humanizer-zh skill）
# ============================================================
[[steps]]
name = "去AI味"
agent = "内容创作专家"
capability = "humanizer-zh"
depends_on = ["内容创作"]
description = "对逐字稿/描述文案/标题执行AI味去除，让人听起来像真人说话"

[steps.inputs]
raw_text = "${steps.内容创作.outputs.deliverable_02}"
titles = "${steps.内容创作.outputs.deliverable_06}"
description = "${steps.内容创作.outputs.deliverable_08}"

[steps.outputs]]
deai_text = "去AI味后的逐字稿（口语化，无AI痕迹）"
deai_titles = "去AI味后的标题"
deai_description = "去AI味后的描述文案"
ai_traces_removed = "修复的AI痕迹清单（如：三段式/-ing结尾/AI词汇/夸大表达等）"

# ============================================================
# STEP 4：查违禁词（douyin-sensitive-check skill）
# ============================================================
[[steps]]
name = "查违禁词"
agent = "内容创作专家"
capability = "douyin-sensitive-check"
depends_on = ["去AI味"]
description = "对去AI味后的文本执行抖音违禁词检测，确保合规发布"

[steps.inputs]
text_to_check = "${steps.去AI味.outputs.deai_text}"
titles_to_check = "${steps.去AI味.outputs.deai_titles}"
description_to_check = "${steps.去AI味.outputs.deai_description}"

[steps.outputs]]
violation_report = "违禁词检测报告（逐字稿/标题/描述各一份）"
violations_found = "发现的违禁词列表（若无则为空）"
final_pass_text = "合规通过版本（可直接发布）"
publish_ready = "是否通过（true/false）"

# ============================================================
# STEP 5：数据分析报告师（可选，发布后触发）
# ============================================================
[[steps]]
name = "数据复盘"
agent = "数据分析报告师"
capability = "data-analysis"
required = false
trigger = "manual"  # 手动触发（视频发布后）
description = "基于视频发布数据，进行复盘分析并输出策略调整建议"

[steps.inputs]
video_metrics = "播放量/完播率/互动率/涨粉数/收藏数/转发数"
content_plan = "${steps.内容创作.outputs.deliverable_01-12}"
account_context = "账号当前阶段（冷启动/起量/爆发/成熟）"

[steps.outputs]]
data_report = "数据复盘报告（对比流量预计+实际数据，逐指标分析）"
strategy_adjustment = "策略调整建议（下期优化方向）"
budget_roi_analysis = "本期投放ROI分析（若有投放）"
next_episode_suggestion = "下期选题方向建议"
[[steps]]
name = "数据复盘"
agent = "数据分析报告师"
capability = "data-analysis"
required = false
trigger = "manual"  # 手动触发（视频发布后）
description = "基于视频发布数据，进行复盘分析并输出策略调整建议"

[steps.inputs]
video_metrics = "播放量/完播率/互动率/涨粉数/收藏数/转发数"
content_plan = "${steps.内容创作.outputs.deliverable_01-12}"
account_context = "账号当前阶段（冷启动/起量/爆发/成熟）"

[steps.outputs]]
data_report = "数据复盘报告（对比流量预计+实际数据，逐指标分析）"
strategy_adjustment = "策略调整建议（下期优化方向）"
budget_roi_analysis = "本期投放ROI分析（若有投放）"
next_episode_suggestion = "下期选题方向建议"
